# About Section
about_title: Professional Summary
about_content: |
  Results driven, kindness forward cybersecurity professional with **∞ years** of experience being the person everyone wants on their team.

  Proven track record of staying calm while everything is on fire, turning chaos into timelines, and making new people feel welcome on day one. Seeking a role where I can continue to be extremely Kayne.

  <mark>Note to recruiters:</mark> this resume is a loving parody written by his fans. The real Kayne is somehow even more impressive.

